[package]
name = "iconator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
fst = "0.4.7"
lazy_static = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
fst = "0.4.7"
